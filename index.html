<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Xe Tăng 30/4</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; }
    canvas { display: block; }
    #controls { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; }
    .btn { width: 60px; height: 60px; margin: 0 20px; background: rgba(255,255,255,0.7); border-radius: 50%; font-size: 30px; display: flex; align-items: center; justify-content: center; user-select: none; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="controls">
    <div class="btn" id="leftBtn">&#9664;</div>
    <div class="btn" id="upBtn">&#9650;</div>
    <div class="btn" id="rightBtn">&#9654;</div>
  </div>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; // recreate gradient bgGradient = ctx.createLinearGradient(0, 0, 0, H); bgGradient.addColorStop(0, '#87CEEB'); bgGradient.addColorStop(1, '#FFFFFF'); });

let bgGradient = ctx.createLinearGradient(0, 0, 0, H); bgGradient.addColorStop(0, '#87CEEB'); bgGradient.addColorStop(1, '#FFFFFF');

// Gate const gate = { x: W / 2 - 75, y: H / 2 - 150, width: 150, height: 300, broken: false };

// Tank const tank = { x: 20, y: H - 80, width: 100, height: 50, speed: 0, maxSpeed: 6, accel: 0.3 };

const keys = { left: false, right: false, up: false };

// Touch controls document.getElementById('leftBtn').addEventListener('touchstart', () => { keys.left = true; }); document.getElementById('leftBtn').addEventListener('touchend', () => { keys.left = false; }); document.getElementById('rightBtn').addEventListener('touchstart', () => { keys.right = true; }); document.getElementById('rightBtn').addEventListener('touchend', () => { keys.right = false; }); document.getElementById('upBtn').addEventListener('touchstart', () => { keys.up = true; }); document.getElementById('upBtn').addEventListener('touchend', () => { keys.up = false; });

// Keyboard controls window.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') keys.left = true; if (e.key === 'ArrowRight') keys.right = true; if (e.key === 'ArrowUp') keys.up = true; }); window.addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft') keys.left = false; if (e.key === 'ArrowRight') keys.right = false; if (e.key === 'ArrowUp') keys.up = false; });

function update() { if (keys.up) tank.speed += tank.accel; else tank.speed -= tank.accel; tank.speed = Math.max(0, Math.min(tank.speed, tank.maxSpeed)); if (keys.right) tank.x += tank.speed; if (keys.left) tank.x -= tank.speed;

// Boundaries
if (tank.x < 0) tank.x = 0;
if (tank.x + tank.width > W) tank.x = W - tank.width;

// Collision
if (!gate.broken && tank.x + tank.width > gate.x && tank.y < gate.y + gate.height) gate.broken = true;

}

function drawGate() { ctx.fillStyle = gate.broken ? 'rgba(200,200,200,0.5)' : '#FFF'; // pillars ctx.fillRect(gate.x, gate.y, gate.width, gate.height); // arch ctx.beginPath(); ctx.arc(gate.x + gate.width / 2, gate.y, gate.width / 2, Math.PI, 0); ctx.fill(); }

function drawTank() { ctx.save(); ctx.translate(tank.x + tank.width / 2, tank.y + tank.height / 2); ctx.fillStyle = '#2E8B57'; ctx.fillRect(-tank.width / 2, -tank.height / 2, tank.width, tank.height); // turret ctx.beginPath(); ctx.arc(0, -tank.height / 2, 20, 0, 2 * Math.PI); ctx.fillStyle = '#556B2F'; ctx.fill(); // barrel ctx.fillRect(-7, -tank.height / 2 - 40, 14, 40); ctx.restore(); }

function draw() { ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, W, H); drawGate(); drawTank(); if (gate.broken) { ctx.fillStyle = 'rgba(255,0,0,0.7)'; ctx.font = 'bold 50px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Chúc mừng 30/4', W / 2, H / 4); } }

function loop() { update(); draw(); requestAnimationFrame(loop); }

loop(); </script>

</body>
</html>
