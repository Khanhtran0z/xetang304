<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Xe Tăng 30/4 – Húc cổng Dinh Độc Lập</title>

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --green:#2e8b57;
  --accent:#d62828;
  --pixel:#f4e04d;
  --dark:#181818;
}
*{box-sizing:border-box;margin:0;padding:0;}
body,html{height:100%;width:100%;background:var(--dark);overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;}
/* ---------- TITLE BAR ---------- */
#titleBar{
  position:absolute;top:0;width:100%;text-align:center;z-index:5;
  font-family:'Press Start 2P',monospace;font-size:clamp(24px,6vw,64px);
  letter-spacing:1px;color:var(--pixel);text-shadow:4px 4px #000;
  padding:10px 0;
}
/* ---------- GAME CANVAS ---------- */
#gameCanvas{display:block;width:100%;height:100%;}
/* BG dinh (placeholder) – tô thẳng lên body nếu chưa render canvas */
body::before{
  content:'';position:fixed;inset:0;
  background:url('https://i.imgur.com/Zh0U9Dx.jpg') center/cover no-repeat; /* ảnh Dinh Độc Lập */
  filter:brightness(.65);z-index:-2;
}
/* ---------- GATE IMAGES (đặt trên canvas để demo) ---------- */
.gateSprite{
  position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
  width: clamp(220px,40vw,420px);pointer-events:none;
}
/* ---------- HUD ---------- */
#hud{
  position:absolute;left:10px;top:60px;z-index:6;
  color:#fff;font-weight:600;text-shadow:0 0 4px #000;font-size:1rem;
  display:flex;gap:1rem;
}
/* ---------- VIRTUAL CONTROLS ---------- */
#controls{
  position:absolute;bottom:7vh;width:100%;display:flex;justify-content:center;gap:3rem;z-index:5;
}
.vbtn{
  width:70px;height:70px;border-radius:50%;
  background:rgba(255,255,255,.25);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  font-family:'Press Start 2P',monospace;font-size:1.7rem;color:#fff;
  user-select:none;pointer-events:auto;transition:transform .12s,background .12s;
}
.vbtn:active{transform:scale(.9);background:var(--accent);}
@media (min-aspect-ratio:13/9){#controls{bottom:4vh}}
/* ---------- POP-UP OVERLAY ---------- */
.popup{
  position:absolute;inset:0;background:rgba(0,0,0,.7);display:none;
  flex-direction:column;justify-content:center;align-items:center;z-index:10;color:#fff;text-align:center;
}
.popup h2{font-family:'Press Start 2P';font-size:2rem;margin-bottom:1rem;}
.popup button{
  margin-top:1.2rem;padding:.9rem 2.8rem;border:none;border-radius:50px;background:var(--green);
  color:#fff;font-weight:600;font-size:1rem;cursor:pointer;
}
</style>
</head>
<body>

<!-- ===== TITLE ===== -->
<div id="titleBar">XE TĂNG 30/4</div>

<!-- ===== GAME AREA ===== -->
<canvas id="gameCanvas"></canvas>

<!-- ===== GATE (demo 2 sprite) ===== -->
<img id="gateIntact" class="gateSprite" src="https://i.imgur.com/H5pvuc8.png" alt="Cổng nguyên">
<img id="gateBroken" class="gateSprite" src="https://i.imgur.com/ZyWfzZl.png" alt="Cổng vỡ" style="display:none">

<!-- ===== HUD ===== -->
<div id="hud">
  <span id="score">Điểm: 0</span>
  <span id="speed">Tốc độ: 0</span>
</div>

<!-- ===== MOBILE CONTROLS ===== -->
<div id="controls">
  <div class="vbtn" id="leftBtn">◀</div>
  <div class="vbtn" id="upBtn">▲</div>
  <div class="vbtn" id="rightBtn">▶</div>
</div>

<!-- ===== POP-UPS ===== -->
<section id="menu" class="popup" style="display:flex">
  <h2>BẮT ĐẦU</h2>
  <button id="startBtn">CHƠI NGAY</button>
</section>

<section id="endGame" class="popup">
  <h2 id="endTitle">CHIẾN THẮNG!</h2>
  <p id="finalMsg"></p>
  <button id="replayBtn">CHƠI LẠI</button>
</section>

<!-- ===== GAME LOGIC (dán code JS xe tăng ở đây) ===== -->
<script>
/* ---------- BIẾN CƠ BẢN ---------- */
const canvas = document.getElementById('gameCanvas'),
      ctx    = canvas.getContext('2d'),
      menu   = document.getElementById('menu'),
      endUI  = document.getElementById('endGame'),
      startBtn  = document.getElementById('startBtn'),
      replayBtn = document.getElementById('replayBtn'),
      scoreEl   = document.getElementById('score'),
      speedEl   = document.getElementById('speed'),
      gateIntact= document.getElementById('gateIntact'),
      gateBroken= document.getElementById('gateBroken'),
      keys  ={left:false,right:false,up:false};

let W,H,playing=false;

/* ---------- RESIZE ---------- */
function fit(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight;}
fit(); addEventListener('resize',fit);

/* ---------- INPUT ---------- */
const btnMap = {left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp'};
Object.entries(btnMap).forEach(([id,key])=>{
   const el=document.getElementById(id+'Btn');
   el.addEventListener('touchstart',e=>{e.preventDefault();keys[id]=true;});
   el.addEventListener('touchend',  e=>{e.preventDefault();keys[id]=false;});
});
addEventListener('keydown',e=>{if(e.key in btnMap) keys[btnMap[e.key]]=true;});
addEventListener('keyup',e=>{if(e.key in btnMap) keys[btnMap[e.key]]=false;});

/* ---------- GAME OBJECT DEMO (thay bằng thuật toán thật) ---------- */
let x=0,speed=0,score=0;
function resetGame(){
  x=speed=score=0;
  gateIntact.style.display='block';
  gateBroken.style.display='none';
}
function update(){
  if(!playing) return;
  if(keys.up) speed=Math.min(speed+0.12,8);
  else speed=Math.max(speed-0.18,0);
  x+=speed;
  score=Math.floor(x*0.6);
  scoreEl.textContent='Điểm: '+score;
  speedEl.textContent='Tốc độ: '+speed.toFixed(1);
  if(score>300){ // thắng demo
     gateIntact.style.display='none';
     gateBroken.style.display='block';
     finish(true);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  /* tô đường & xe tăng sơ bộ */
  ctx.fillStyle='#c2b280';
  ctx.fillRect(0,H*0.75,W, H*0.25);
  ctx.fillStyle='var(--green)';
  ctx.fillRect(W*0.2, H*0.68,120,60);
}
function loop(){update();draw();requestAnimationFrame(loop);} loop();

/* ---------- FLOW ---------- */
function start(){
  menu.style.display='none'; endUI.style.display='none';
  playing=true; resetGame();
}
function finish(win){
  playing=false;
  document.getElementById('endTitle').textContent = win?'Địt Mẹ 3 Que!':'Húc Không Sập Cổng? Gà vl!';
  document.getElementById('finalMsg').textContent = `Điểm của bạn: ${score}`;
  endUI.style.display='flex';
}

/* ---------- BTN EVENTS ---------- */
startBtn.onclick=start; replayBtn.onclick=start;
</script>
</body>
</html>
